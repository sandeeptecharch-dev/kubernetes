# TechUdaan - Module 1: Kubernetes Architecture
# A 3-node kind cluster: 1 control plane + 2 workers.
#
# Create:  kind create cluster --name techudaan --config kind-3node.yaml
# Delete:  kind delete cluster --name techudaan
#
# Low on RAM (8 GB laptop running slow)? Remove the last "- role: worker"
# line for a 2-node cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
