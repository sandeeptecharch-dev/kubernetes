# TechUdaan - Day 4: expose the "hello" app.
# A NodePort Service on port 30080 on every node.
#
# With the kind-ports.yaml cluster: open http://localhost:30080
# With any other kind cluster:      kubectl port-forward service/hello 8080:80
#                                   then open http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  type: NodePort
  selector:
    app: hello              # send traffic to Pods with this label
  ports:
    - port: 80              # the Service's port inside the cluster
      targetPort: 80        # the container's port
      nodePort: 30080       # the port opened on every node (30000-32767)
