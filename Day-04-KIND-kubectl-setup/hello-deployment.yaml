# TechUdaan - Day 4: your first app, declared in YAML.
# Runs 2 copies of nginx.
#
# Apply:   kubectl apply -f manifests/hello-deployment.yaml
# Check:   kubectl get deployment hello
#          kubectl get pods -l app=hello -o wide
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2                 # desired state: 2 Pods
  selector:
    matchLabels:
      app: hello              # this Deployment manages Pods with this label
  template:                   # the Pod "recipe"
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:         # what the scheduler reserves
              cpu: 50m
              memory: 32Mi
            limits:           # the most it may use
              cpu: 200m
              memory: 128Mi
